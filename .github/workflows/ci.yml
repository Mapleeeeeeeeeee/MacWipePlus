name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Regression tests
        run: swift run MacWipePlusRegressionTests

      - name: Package app
        run: |
          ./scripts/build-app.sh
          ./scripts/package-dmg.sh
          ditto -c -k --sequesterRsrc --keepParent .build/MacWipePlus.app .build/MacWipePlus.zip

      - name: Upload dev artifacts
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: MacWipePlus-dev-${{ github.sha }}
          path: |
            .build/MacWipePlus.dmg
            .build/MacWipePlus.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and package release
        run: |
          swift build
          swift run MacWipePlusRegressionTests
          ./scripts/build-app.sh
          ./scripts/package-dmg.sh
          ditto -c -k --sequesterRsrc --keepParent .build/MacWipePlus.app .build/MacWipePlus.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            .build/MacWipePlus.dmg
            .build/MacWipePlus.zip
